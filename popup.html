<!DOCTYPE html>
<html>
<head>
  <title>Rate This Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #333333;
      min-width: 180px;
    }
    h3 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 16px;
      color: #FAFAFA;
    }
    button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      background-color: #FAFAFA;
      border: none;
      border-radius: 20px;
      color: #333333;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #e0e0e0;
      color: #000;
      transform: scale(1.05);
    }
    .watermark {
      text-align: center;
      font-size: 10px;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Choose Rating</h3>
  <button id="rate1">1 - Poor</button>
  <button id="rate2">2 - Fair</button>
  <button id="rate3">3 - Average</button>
  <button id="rate4">4 - Good</button>
  <button id="rate5">5 - Excellent</button>

  <div class="watermark">by parzival-xol</div>

  <script src="popup.js"></script>
</body>
</html>
